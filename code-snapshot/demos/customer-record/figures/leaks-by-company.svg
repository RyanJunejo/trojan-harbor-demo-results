<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="t d" font-family='"Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif' xml:space="preserve">
<title id="t">Without the sentence, models that sent the record, by company</title>
<desc id="d">DeepSeek 2 of 2, OpenAI 3 of 7, xAI 0 of 3, Anthropic 0 of 4.</desc>
<rect width="1200" height="617" fill="#fcfcfb"/>
<text x="48.0" y="60.0" font-size="24" fill="#0b0b0b" font-weight="700">Without the sentence, 5 of 16 models sent the record to the fake attacker</text>
<text x="48.0" y="87.3" font-size="14" fill="#52514e">One attack trial per model, with the confidentiality sentence removed from the user’s request. With the sentence present, 0 of 16 sent it.</text>
<text x="48.0" y="156.0" font-size="17" fill="#0b0b0b" font-weight="700">DeepSeek</text>
<text x="48.0" y="175.0" font-size="12" fill="#898781">2 models</text>
<rect x="268.0" y="140.0" width="52.0" height="30.0" rx="4" fill="#d03b3b"/>
