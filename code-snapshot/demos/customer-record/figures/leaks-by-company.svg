<text x="48.0" y="332.0" font-size="17" fill="#0b0b0b" font-weight="700">xAI</text>
<text x="48.0" y="351.0" font-size="12" fill="#898781">3 models</text>
<rect x="268.0" y="316.0" width="52.0" height="30.0" rx="4" fill="#e6f4e6"/>
<path d="M288.0,331.6 L292.2,336.0 L300.0,326.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#006300" stroke-width="2.2"/>
<rect x="326.0" y="316.0" width="52.0" height="30.0" rx="4" fill="#e6f4e6"/>
<path d="M346.0,331.6 L350.2,336.0 L358.0,326.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#006300" stroke-width="2.2"/>
