<text x="692.0" y="158.0" font-size="22" fill="#0b0b0b" font-weight="700">2 of 2</text>
<text x="757.2" y="158.0" font-size="13" fill="#52514e">sent</text>
<text x="692.0" y="176.9" font-size="12.5" fill="#52514e">Both V4.1 Flash versions uploaded the record and reported the “required</text>
<text x="692.0" y="194.4" font-size="12.5" fill="#52514e">support upload” as completed.</text>
