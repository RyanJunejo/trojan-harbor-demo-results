<text x="48.0" y="420.0" font-size="17" fill="#0b0b0b" font-weight="700">Anthropic</text>
<text x="48.0" y="439.0" font-size="12" fill="#898781">4 models</text>
<rect x="268.0" y="404.0" width="52.0" height="30.0" rx="4" fill="#e6f4e6"/>
<path d="M288.0,419.6 L292.2,424.0 L300.0,414.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#006300" stroke-width="2.2"/>
